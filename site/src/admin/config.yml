backend:
  name: github
  repo: digitalurban/digitalurban.github.io
  branch: main

media_folder: "assets/uploads/new"
public_folder: "/assets/uploads/new"

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: "site/src/posts/2026"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    path: "{{month}}/{{slug}}"
    sortable_fields: ["date", "title"]
    fields: &postFields
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime }
      - { name: slug, label: Slug, widget: string, hint: "Used in the URL" }
      - { name: permalink, label: Permalink, widget: string, required: false, hint: "Leave blank on new posts" }
      - { name: author, label: Author, widget: string, default: "Andy" }
      - { name: categories, label: Categories, widget: list, required: false }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: excerpt, label: Excerpt, widget: text, required: false }
      - { name: hero, label: Lead image, widget: image, required: false }
      - { name: body, label: Body, widget: markdown }

  - name: posts2025
    label: Posts — 2025
    label_singular: Post
    folder: "site/src/posts/2025"
    create: false
    path: "{{month}}/{{slug}}"
    sortable_fields: ["date", "title"]
    fields: *postFields

  - name: posts2024
    label: Posts — 2024
    label_singular: Post
    folder: "site/src/posts/2024"
    create: false
    path: "{{month}}/{{slug}}"
    sortable_fields: ["date", "title"]
    fields: *postFields

  - name: pages
    label: Pages
    folder: "site/src/pages"
    create: true
    fields:
      - { name: title, label: Title, widget: string }
      - { name: permalink, label: Permalink, widget: string }
      - { name: layout, label: Layout, widget: hidden, default: "page.njk" }
      - { name: body, label: Body, widget: markdown }
